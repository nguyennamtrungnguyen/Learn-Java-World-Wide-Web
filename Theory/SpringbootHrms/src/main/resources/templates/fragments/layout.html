<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | HRMS' : 'HRMS'}">HRMS</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; font-size: 1.4rem; }
        .sidebar {
            min-height: calc(100vh - 56px);
            background: #212529;
            padding-top: 1rem;
        }
        .sidebar .nav-link {
            color: #adb5bd;
            padding: .6rem 1.2rem;
            border-radius: 6px;
            margin: 2px 8px;
            transition: all .2s;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background: #0d6efd;
        }
        .sidebar .nav-link i { margin-right: 8px; }
        .main-content { padding: 1.5rem; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); border-radius: 10px; }
        .card-header { background: #0d6efd; color: white; border-radius: 10px 10px 0 0 !important; font-weight: 600; }
        .table th { background: #e9ecef; }
        .badge-dept { font-size: .78rem; }
        .progress { height: 22px; border-radius: 20px; }
        .stat-card { border-left: 4px solid #0d6efd; }
        footer { background: #212529; color: #adb5bd; padding: 1rem 0; margin-top: 2rem; }
    </style>
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-people-fill text-primary"></i> HRMS
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-house"></i> Trang Chủ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees}">
                        <i class="bi bi-person-badge"></i> Nhân Viên
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/departments}">
                        <i class="bi bi-building"></i> Phòng Ban
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/stats/age}">
                        <i class="bi bi-bar-chart"></i> Thống Kê
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============ LAYOUT: SIDEBAR + CONTENT ============ -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block sidebar py-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:classappend="${#httpServletRequest.requestURI == '/' ? 'active' : ''}">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <hr class="border-secondary"/>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/employees}"
                       th:classappend="${#httpServletRequest.requestURI.startsWith('/employees') ? 'active' : ''}">
                        <i class="bi bi-person-lines-fill"></i> Nhân Viên
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/employees/add}">
                        <i class="bi bi-person-plus"></i> Thêm Nhân Viên
                    </a>
                </li>
                <hr class="border-secondary"/>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/departments}"
                       th:classappend="${#httpServletRequest.requestURI.startsWith('/departments') ? 'active' : ''}">
                        <i class="bi bi-building"></i> Phòng Ban
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/departments/add}">
                        <i class="bi bi-building-add"></i> Thêm Phòng Ban
                    </a>
                </li>
                <hr class="border-secondary"/>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/stats/age}"
                       th:classappend="${#httpServletRequest.requestURI.startsWith('/stats') ? 'active' : ''}">
                        <i class="bi bi-bar-chart-fill"></i> Thống Kê Tuổi
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Page content goes here via th:replace -->
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <small>
            <i class="bi bi-people-fill text-primary"></i>
            HRMS &copy; 2026 — IUH FIT — NguyenNamTrungNguyen
        </small>
    </div>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js (dùng cho trang thống kê) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

</body>
</html>
