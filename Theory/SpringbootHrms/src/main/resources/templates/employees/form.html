<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle + ' | HRMS'}">Form Nhân Viên | HRMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: calc(100vh - 56px); background: #212529; padding-top: 1rem; }
        .sidebar .nav-link { color: #adb5bd; padding: .6rem 1.2rem; border-radius: 6px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #0d6efd; }
        .sidebar .nav-link i { margin-right: 8px; }
        .main-content { padding: 1.5rem; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); border-radius: 10px; }
        .card-header { background: #0d6efd; color: white; border-radius: 10px 10px 0 0 !important; font-weight: 600; }
        footer { background: #212529; color: #adb5bd; padding: 1rem 0; margin-top: 2rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-people-fill text-primary"></i> HRMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/employees}"><i class="bi bi-person-badge"></i> Nhân Viên</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/departments}"><i class="bi bi-building"></i> Phòng Ban</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/stats/age}"><i class="bi bi-bar-chart"></i> Thống Kê</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar py-3">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <hr class="border-secondary"/>
                <li class="nav-item"><a class="nav-link active" th:href="@{/employees}"><i class="bi bi-person-lines-fill"></i> Nhân Viên</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/employees/add}"><i class="bi bi-person-plus"></i> Thêm Nhân Viên</a></li>
                <hr class="border-secondary"/>
                <li class="nav-item"><a class="nav-link" th:href="@{/departments}"><i class="bi bi-building"></i> Phòng Ban</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/departments/add}"><i class="bi bi-building-add"></i> Thêm Phòng Ban</a></li>
                <hr class="border-secondary"/>
                <li class="nav-item"><a class="nav-link" th:href="@{/stats/age}"><i class="bi bi-bar-chart-fill"></i> Thống Kê Tuổi</a></li>
            </ul>
        </nav>

        <main class="col-md-10 main-content">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <nav aria-label="breadcrumb" class="mb-3">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/employees}">Nhân Viên</a></li>
                            <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
                        </ol>
                    </nav>

                    <div class="card">
                        <div class="card-header">
                            <i class="bi bi-person-badge"></i>
                            <span th:text="${pageTitle}">Form Nhân Viên</span>
                        </div>
                        <div class="card-body p-4">
                            <!--
                                QUAN TRỌNG: dept (ManyToOne) không thể bind trực tiếp từ form HTML.
                                Giải pháp: Bind deptId riêng (hidden + select), Controller sẽ tự set dept.
                            -->
                            <form th:action="@{/employees/save}" method="post">
                                <!-- Hidden ID for edit mode -->
                                <input type="hidden" name="empId"
                                       th:value="${employee.empId != null ? employee.empId : ''}"/>

                                <!-- Tên Nhân Viên -->
                                <div class="mb-3">
                                    <label for="empName" class="form-label fw-semibold">
                                        <i class="bi bi-person-fill text-primary"></i> Họ và Tên
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           class="form-control"
                                           id="empName"
                                           name="empName"
                                           th:value="${employee.empName}"
                                           placeholder="Nhập họ và tên đầy đủ..."
                                           required
                                           maxlength="150"/>
                                </div>

                                <!-- Ngày Sinh -->
                                <div class="mb-3">
                                    <label for="dob" class="form-label fw-semibold">
                                        <i class="bi bi-calendar-date text-danger"></i> Ngày Sinh
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="date"
                                           class="form-control"
                                           id="dob"
                                           name="dob"
                                           th:value="${employee.dob != null ? #dates.format(employee.dob, 'yyyy-MM-dd') : ''}"
                                           required
                                           min="1950-01-01"
                                           th:max="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}"/>
                                    <div class="form-text">Dùng để tính tuổi trong thống kê.</div>
                                </div>

                                <!-- Phòng Ban -->
                                <div class="mb-4">
                                    <label for="deptId" class="form-label fw-semibold">
                                        <i class="bi bi-building-fill text-success"></i> Phòng Ban
                                        <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" id="deptId" name="deptId" required>
                                        <option value="">-- Chọn phòng ban --</option>
                                        <option th:each="dept : ${departments}"
                                                th:value="${dept.deptId}"
                                                th:text="${dept.deptName}"
                                                th:selected="${employee.dept != null and employee.dept.deptId == dept.deptId}">
                                        </option>
                                    </select>
                                </div>

                                <!-- Buttons -->
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-save"></i>
                                        <span th:text="${isEdit ? 'Cập Nhật' : 'Thêm Mới'}">Lưu</span>
                                    </button>
                                    <a th:href="@{/employees}" class="btn btn-outline-secondary">
                                        <i class="bi bi-x-circle"></i> Hủy
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer class="text-center mt-4">
    <div class="container"><small><i class="bi bi-people-fill text-primary"></i> HRMS &copy; 2026</small></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
