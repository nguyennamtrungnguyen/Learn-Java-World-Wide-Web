<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Cập nhật sản phẩm</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header">

                    <h3 class="mb-0">
                        Cập nhật sản phẩm
                    </h3>

                </div>

                <div class="card-body">

                    <form
                            th:action="@{/products/update/{id}(id=${product.proid})}"
                            th:object="${product}"
                            method="post">


                        <!-- ID -->

                        <div class="mb-3">

                            <label class="form-label">
                                ID
                            </label>

                            <input
                                    type="text"
                                    th:field="*{proid}"
                                    class="form-control"
                                    readonly>

                        </div>


                        <!-- Tên -->

                        <div class="mb-3">

                            <label class="form-label">

                                Tên sản phẩm

                            </label>

                            <input
                                    type="text"
                                    th:field="*{proname}"
                                    class="form-control"
                                    required>

                        </div>


                        <!-- Giá -->

                        <div class="mb-3">

                            <label class="form-label">

                                Giá

                            </label>

                            <input
                                    type="number"
                                    th:field="*{price}"
                                    class="form-control"
                                    min="0"
                                    step="0.01">

                        </div>


                        <!-- Image -->

                        <div class="mb-3">

                            <label class="form-label">

                                Đường dẫn hình ảnh

                            </label>

                            <input
                                    type="text"
                                    th:field="*{image}"
                                    class="form-control">

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button
                                    type="submit"
                                    class="btn btn-success">

                                Cập nhật

                            </button>

                            <a
                                    th:href="@{/products}"
                                    class="btn btn-secondary">

                                Hủy

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
