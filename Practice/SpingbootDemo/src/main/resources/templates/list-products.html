<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Danh sách sản phẩm</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Danh sách sản phẩm
        </h2>

        <a
                th:href="@{/products/add}"
                class="btn btn-primary">

            + Thêm mới

        </a>

    </div>


    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Hình ảnh</th>

                        <th>Tên sản phẩm</th>

                        <th>Giá</th>

                        <th class="text-center">
                            Thao tác
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="product : ${products}">

                        <td
                                th:text="${product.proid}">
                        </td>

                        <td>

                            <img
                                    th:if="${product.image != null and product.image != ''}"
                                    th:src="${product.image}"
                                    alt="Product Image"
                                    width="80"
                                    height="80"
                                    style="object-fit: cover;">

                            <span
                                    th:if="${product.image == null or product.image == ''}">
                                Không có ảnh
                            </span>

                        </td>

                        <td
                                th:text="${product.proname}">
                        </td>

                        <td>

                            <span
                                    th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            </span>

                        </td>

                        <td class="text-center">

                            <a
                                    th:href="@{/products/edit/{id}(id=${product.proid})}"
                                    class="btn btn-warning btn-sm">

                                Sửa

                            </a>


                            <a
                                    th:href="@{/products/delete/{id}(id=${product.proid})}"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này không?')">

                                Xóa

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(products)}">

                        <td
                                colspan="5"
                                class="text-center">

                            Chưa có sản phẩm nào.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
