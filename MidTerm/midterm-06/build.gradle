plugins {
    id 'java'
    id 'war'
}

group 'vn.fit'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.0'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // =====================================================
    // TOMCAT 10.1 PROVIDES THESE APIs
    // =====================================================
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'
    compileOnly 'jakarta.el:jakarta.el-api:5.0.1'

    // =====================================================
    // REST - JAX-RS / JERSEY
    // =====================================================
    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:3.1.11'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.11'
    implementation 'org.glassfish.jersey.inject:jersey-cdi2-se:3.1.11'

    // =====================================================
    // CDI - WELD FOR TOMCAT
    // =====================================================
    implementation 'org.jboss.weld.servlet:weld-servlet-shaded:5.1.5.Final'

    // =====================================================
    // JSP / JSTL
    // =====================================================
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // =====================================================
    // DATABASE - MARIADB JDBC
    // =====================================================
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.6'

    // =====================================================
    // TEST
    // =====================================================
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}