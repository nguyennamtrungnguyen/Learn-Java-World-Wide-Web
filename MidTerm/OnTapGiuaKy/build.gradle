plugins {
    id 'java'
    id 'war'
}

group 'iuh.fit'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.9.2'
    weldVersion = '5.1.2.Final'
    jerseyVersion = '3.1.5'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {

    // ============================================================
    // Tomcat 10.1
    // ============================================================
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'


    // ============================================================
    // CDI
    // ============================================================
    compileOnly 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'

    implementation "org.jboss.weld.servlet:weld-servlet-core:${weldVersion}"


    // ============================================================
    // Jersey REST
    // ============================================================
    implementation "org.glassfish.jersey.containers:jersey-container-servlet:${jerseyVersion}"
    implementation "org.glassfish.jersey.inject:jersey-hk2:${jerseyVersion}"


    // ============================================================
    // Jersey + Jackson JSON
    // ============================================================
    implementation "org.glassfish.jersey.media:jersey-media-json-jackson:${jerseyVersion}"

    // Jackson JAXB annotations
    implementation 'com.fasterxml.jackson.module:jackson-module-jaxb-annotations:2.15.3'

    // JAXB API
    implementation 'javax.xml.bind:jaxb-api:2.3.1'

    // JAXB runtime
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.8'


    // ============================================================
    // Jersey + CDI
    // ============================================================
    implementation "org.glassfish.jersey.ext.cdi:jersey-cdi1x:${jerseyVersion}"
    implementation "org.glassfish.jersey.ext.cdi:jersey-cdi1x-servlet:${jerseyVersion}"
    implementation "org.glassfish.jersey.ext.cdi:jersey-cdi-rs-inject:${jerseyVersion}"


    // ============================================================
    // MariaDB
    // ============================================================
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'


    // ============================================================
    // JUnit
    // ============================================================
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
    useJUnitPlatform()
}